<style>

body{
margin:0;
font-family:Arial;
background:#faf7ef;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:space-between;
padding:20px 50px;
background:linear-gradient(45deg,#6d4c41,#5d4037);
}

.logo{
font-size:24px;
font-weight:bold;
color:#ffcc80;
}

.menu a{
margin-left:20px;
text-decoration:none;
color:white;
font-weight:bold;
}

/* HEADER */
.header{
background:linear-gradient(120deg,#8d6e63,#5d4037);
padding:60px;
text-align:center;
color:white;
}

.search input{
padding:12px 25px;
border-radius:25px;
border:none;
width:300px;
}

/* MAIN */
.container{
padding:50px;
}

.page{
display:flex;
gap:40px;
}

/* SIDEBAR */
.sidebar{
width:250px;
background:#fffaf0;
padding:20px;
border-radius:15px;
border:1px solid #e0d6c8;
height:fit-content;
}

.sidebar label{
display:block;
margin:10px 0;
cursor:pointer;
}

/* RIGHT */
.content{
flex:1;
}

/* CATEGORY */
.categories{
display:flex;
gap:25px;
margin-bottom:30px;
font-weight:bold;
}

.categories span{
cursor:pointer;
color:#8d6e63;
}

.categories span.active{
color:#4e342e;
border-bottom:2px solid #ffcc80;
padding-bottom:5px;
}

/* BOOK GRID */
.books{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:30px;
}

.card{
background:#fffaf0;
border:1px solid #bcaaa4;
border-radius:15px;
padding:15px;
text-align:center;
cursor:pointer;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
border-radius:12px;
}

.card p{
font-weight:bold;
color:#4e342e;
}

.heart{
position:absolute;
top:10px;
right:15px;
font-size:22px;
cursor:pointer;
}

.card{
position:relative;
}

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}

.popup-content{
background:#fff3e0;
padding:30px;
border-radius:15px;
width:300px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.contact-footer{
background:linear-gradient(45deg,#3e2723,#2d1b18);
color:white;
text-align:center;
padding:30px 20px;
margin-top:30px;
}

.contact-box{
background:#f7f1e6;
padding:15px 30px;
border-radius:20px;
display:inline-block;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}



.contact-btn{
border:none;
padding:12px 25px;
margin:10px;
border-radius:12px;
font-size:16px;
cursor:pointer;
background:#5d4037;
color:white;
transition:0.3s;
}

.contact-btn:hover{
transform:scale(1.05);
}

.whatsapp{
background:#25D366;
}

.email{
background:#D44638;
}

.copyright{
margin-top:15px;
font-size:14px;
color:#ddd;
}



</style>
</head>

<script>



/* SEARCH */
document.getElementById("search").addEventListener("keyup", applyFilters);

/* CATEGORY CLICK */
document.querySelectorAll(".categories span").forEach(btn=>{
btn.onclick = () => {

document.querySelectorAll(".categories span")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

applyFilters();

};
});

/* GENRE CHECKBOX */
document.querySelectorAll(".genre").forEach(ch=>{
ch.addEventListener("change", applyFilters);
});


/* MAIN FILTER FUNCTION */
function applyFilters(){

let searchValue = document.getElementById("search").value.toLowerCase();

let activeCategory = document.querySelector(".categories .active").dataset.filter;

let selectedGenres = [];
document.querySelectorAll(".genre:checked").forEach(ch=>{
selectedGenres.push(ch.value.toLowerCase());
});

document.querySelectorAll(".card").forEach(card=>{

let name = card.dataset.name.toLowerCase();
let genre = card.dataset.genre.toLowerCase();

/* SEARCH */
let searchMatch = name.includes(searchValue);

/* GENRE */
let genreMatch = selectedGenres.length === 0 || selectedGenres.includes(genre);

/* CATEGORY */
let categoryMatch = true;

if(activeCategory === "жаңа"){
categoryMatch = card.dataset.year >= 1960;
}

if(activeCategory === "көп"){
categoryMatch = card.dataset.rating >= 4.7;
}

if(activeCategory === "ұсынылған"){
categoryMatch = card.dataset.audio === "Бар";
}

/* SHOW / HIDE */
card.parentElement.style.display =
(searchMatch && genreMatch && categoryMatch)
? "block" : "none";

});

}


/* POPUP */
document.querySelectorAll(".card").forEach(card=>{

card.onclick = () => {

document.getElementById("popup").style.display="flex";

document.getElementById("popupTitle").innerText = card.dataset.name;
document.getElementById("popupAuthor").innerText = "📖 Автор: " + card.dataset.author;
document.getElementById("popupYear").innerText = "📅 Жылы: " + card.dataset.year;
document.getElementById("popupGenre").innerText = "📚 Жанр: " + card.dataset.genre;
document.getElementById("popupAudio").innerText = "🎧 Аудио: " + card.dataset.audio;
document.getElementById("popupRating").innerText = "⭐ Рейтинг: " + card.dataset.rating;
document.getElementById("popupComment").innerText = "💬 Пікір: " + card.dataset.comment;

};

});

function closePopup(){
document.getElementById("popup").style.display="none";
}



</script>
