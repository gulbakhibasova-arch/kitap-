<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Кіру</title>

<style>

body{
font-family:Arial;
background:linear-gradient(120deg,#84fab0,#8fd3f4);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.form-box{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
width:300px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#4CAF50;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="form-box">

<h2>Кіру</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">

<button onclick="login()">Кіру</button>

</div>

<script>

function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

let savedEmail=localStorage.getItem("userEmail");
let savedPassword=localStorage.getItem("userPassword");

if(email===savedEmail && password===savedPassword){

alert("Қош келдіңіз!");
window.location.href="index.html";

}
else{
alert("Қате логин немесе пароль");
}

}

</script>

</body>
</html>
